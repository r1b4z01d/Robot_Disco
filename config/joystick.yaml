joy_node:
  ros__parameters:
    # Match by SDL name, not index: the SpaceMouse / Stream Deck / receivers share the js numbering
    # and it shifts on every USB re-enumeration (the SpaceMouse took js0 on 2026-10-12, so
    # device_id 0 silently fed the SpaceMouse to teleop and the Bluetooth pad looked dead).
    device_name: "8BitDo Ultimate 2C Wireless"
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.25
    scale_linear_turbo:
      x: 0.5

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 1.0


    # Button indices follow joy's SDL GameController mapping when the pad is recognised (the 8BitDo
    # Ultimate 2C over Bluetooth is): 0 A, 1 B, 2 X, 3 Y, 4 back, 5 guide, 6 start, 7 LS, 8 RS,
    # 9 LB, 10 RB, 11-14 d-pad. The previous 5/6 were the raw xpad order (RB/back) of the old PC's
    # unmapped pad; same physical buttons, new numbers (2026-10-11).
    # Measured 2026-10-11 with the 8BitDo Ultimate 2C over Bluetooth on the Jetson (its SDL mapping
    # does NOT put RB at 10): the shoulder button the operator holds reports index 7. Re-measured
    # 2026-10-27 (same pad, Bluetooth): LB reports 6 (it was 9 on 10-11 — the mapping moved).
    # Re-measure with a /joy subscriber if the pad, link or joy version changes.
    enable_button: 7         # hold to drive (RB)
    enable_turbo_button: 6   # LB: hold for the turbo scales (2x linear and angular); applies on its own too

    require_enable_button: true