scan_to_scan_filter_chain:
  ros__parameters:
    HW_ID: none
    filter1:
      name: polygon_filter
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_link
        # base_link frame. Measured from scan: front casters sit at x~0.34-0.51, |y|~0.34 (URDF caster y is wrong),
        # drive wheels at |y|~0.27-0.35. Centre front kept at x=0.47 so the stop polygon (x=0.5) isn't blinded.
        polygon: "[[0.47, 0.2], [0.47, -0.2], [0.55, -0.2], [0.55, -0.42], [-0.5, -0.42], [-0.5, -0.1], [-0.6, -0.1], [-0.6, 0.1], [-0.5, 0.1], [-0.5, 0.42], [0.55, 0.42], [0.55, 0.2]]"
        invert: false
        #footprint_topic: base_footprint_exclude
    filter2:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 2.0
        max_range_difference: 0.1
        filter_window: 3