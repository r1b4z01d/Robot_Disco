collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Sits between twist_mux and the diff drive controller so every velocity
    # source (joystick, nav, behavior server) is gated by it:
    #   twist_mux -> cmd_vel_raw -> collision_monitor -> /diff_cont/cmd_vel_unstamped
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "/diff_cont/cmd_vel_unstamped"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonSlow","PolygonStop"]
    PolygonStop:
      type: "polygon"
      # Nose at x=0.50: 5 cm past the footprint nose (0.45, nav2_params.yaml) and 3 cm past the body-filter
      # outline (0.47). It was 0.60 until 2026-11-03: a thin object 0.56 m dead ahead then held the robot
      # stopped for good, since "stop" also zeroes rotation and the joystick, so nothing could turn away.
      # PolygonSlow (0.8 m ahead) still gives the early warning.
      points: [0.3, 0.3, 0.5, 0.0, 0.3, -0.3, -0.35, -0.2, -0.35, 0.2]
      action_type: "stop"
      # Humble (nav2 1.1.x) name. Triggers when MORE than this many points are inside.
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "polygon"
      points: [0.8, 0.4, 0.8, -0.4, -0.8, -0.4, -0.8, 0.4]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["rp_s1_lidar","rp_s2e_lidar"]
    rp_s1_lidar:
      type: "scan"
      topic: "/rp_s1_lidar/scan_filtered"
      enabled: True
    rp_s2e_lidar:
      type: "scan"
      topic: "/rp_s2e_lidar/scan_filtered"
      enabled: True
