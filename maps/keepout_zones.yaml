# No-go zones for the Nav2 keepout filter, in map metres (zone_one.yaml frame). Each zone is a polygon
# (any number of vertices, listed in order). Regenerate the mask after editing:
#     python3 maps/make_keepout_mask.py          (writes keepout_mask.pgm / keepout_mask.yaml next to it)
# then restart the navigation unit (the mask server reads the file at startup).
# Drawn 2026-11-02 from Bryan's yellow boxes on the 2D route editor (px -> map fit on the tigger_test
# waypoints, +-5 cm).
map: zone_one.yaml
zones:
  - name: top_box                      # the big room at the top of the map
    polygon: [[2.60, 7.25], [6.90, 7.25], [6.90, 9.85], [2.60, 9.85]]
  - name: right_box                    # the nook right of the hallway, below the right bookshelf
    polygon: [[8.70, 2.35], [9.75, 2.35], [9.75, 4.90], [8.70, 4.90]]
  - name: bottom_L                     # L along the bottom edge: the bar and the stem up to y 0.5
    polygon: [[1.00, -1.80], [6.10, -1.80], [6.10, 0.50], [5.05, 0.50], [5.05, -0.80], [1.00, -0.80]]
